          - "-U"
          - "-Xlinker"
          - "_$$s7SwiftUI6_GlassV8appIconsACvgZ"
          - "-Xlinker"
          - "-U"
          - "-Xlinker"
          - "_$$s7SwiftUI6_GlassV8avplayerACvgZ"
          - "-Xlinker"
          - "-U"
          - "-Xlinker"
          - "_$$s7SwiftUI6_GlassV8keyboardACvgZ"
          - "-Xlinker"
          - "-U"
          - "-Xlinker"
          - "_$$s7SwiftUI6_GlassV8monogramACvgZ"

schemes:
  Kitzi:
    build:
      targets:
        Kitzi: all
    run:
      config: Debug
    archive:
      config: Release
